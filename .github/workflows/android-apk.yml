name: Android debug APK
on:
  push:
    paths:
      - 'native-game/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install Android SDK and .NET Android workload
        run: |
          set -o pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" 'platforms;android-34' 'build-tools;34.0.0' 'ndk;26.1.10909125' 2>&1 | tee /tmp/sdk.log || { echo "::error::SDK setup failed: $(tail -n 5 /tmp/sdk.log | tr '\n' ' ')"; exit 1; }
          (cd native-game && dotnet workload install android) 2>&1 | tee /tmp/workload.log || { echo "::error::Workload setup failed: $(tail -n 5 /tmp/workload.log | tr '\n' ' ')"; exit 1; }
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: true
          include-templates: true
      - name: Build native C++ driving library
        working-directory: native-game
        run: |
          set -o pipefail
          TOOLCHAIN="$ANDROID_HOME/ndk/26.1.10909125/build/cmake/android.toolchain.cmake"
          if [ ! -f "$TOOLCHAIN" ]; then
            echo "::error::NDK is missing. SDK output: $(tail -n 8 /tmp/sdk.log | tr '\n' ' ')"
            exit 1
          fi
          cmake -S Native -B /tmp/driving-build \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/26.1.10909125/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-24 2>&1 | tee /tmp/cmake.log || { echo "::error::CMake failed: $(tail -n 12 /tmp/cmake.log | tr '\n' ' ')"; exit 1; }
          cmake --build /tmp/driving-build --config Release 2>&1 | tee /tmp/cmake-build.log || { echo "::error::Build failed: $(tail -n 12 /tmp/cmake-build.log | tr '\n' ' ')"; exit 1; }
          mkdir -p native/bin/arm64-v8a native/bin/x86_64
          cp /tmp/driving-build/libdriving.so native/bin/arm64-v8a/
          cmake -S Native -B /tmp/driving-x86 -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN" -DANDROID_ABI=x86_64 -DANDROID_PLATFORM=android-24
          cmake --build /tmp/driving-x86 --config Release
          cp /tmp/driving-x86/libdriving.so native/bin/x86_64/
      - name: Configure Godot Android export
        run: |
          mkdir -p "$HOME/.config/godot" "$HOME/.android"
          [ -f "$HOME/.android/debug.keystore" ] || keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Android Debug,O=Android,C=US'
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<SETTINGS
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          SETTINGS
      - name: Import and compile C#
        working-directory: native-game
        run: |
          godot --headless --editor --import --quit 2>&1 | tee /tmp/import.log || { echo "::error::Godot import: $(tail -n 12 /tmp/import.log | tr '\n' ' ')"; exit 1; }
          dotnet build CoastalCity.csproj --configuration Debug 2>&1 | tee /tmp/dotnet-build.log || { echo "::error::C# build: $(tail -n 16 /tmp/dotnet-build.log | tr '\n' ' ')"; exit 1; }
      - name: Export and verify APK
        working-directory: native-game
        run: |
          mkdir -p build
          godot --headless --verbose --export-debug 'Android arm64' "$(pwd)/build/CoastalCity-debug.apk" 2>&1 | tee /tmp/export.log || { echo "::error::Godot export: $(tail -n 16 /tmp/export.log | tr '\n' ' ')"; exit 1; }
          if grep -Ei 'Export \.NET Project|Publish failed|InvalidOperationException|^ERROR:' /tmp/export.log; then echo "::error::Godot export reported: $(grep -Ei -A 3 -B 3 'error|failed|exception' /tmp/export.log | tail -n 30 | tr '\n' ' ' | cut -c1-7000)"; exit 1; fi
          test -s build/CoastalCity-debug.apk || { echo "::error::APK missing. Godot: $(tail -n 25 /tmp/export.log | tr '\n' ' ')"; exit 1; }
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose build/CoastalCity-debug.apk 2>&1 | tee /tmp/apksigner.log || { echo "::error::Signing verification: $(tail -n 8 /tmp/apksigner.log | tr '\n' ' ')"; exit 1; }
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging build/CoastalCity-debug.apk > /tmp/badging.txt || { echo "::error::APK badging failed"; exit 1; }
          head -n 10 /tmp/badging.txt
          unzip -l build/CoastalCity-debug.apk > /tmp/apk-files.txt
          echo "::notice::Bundled runtime: $(grep -Ei 'hostfxr|godotsharp|coastalcity|libcoreclr' /tmp/apk-files.txt | tr '\n' ' ' | cut -c1-7000)"
          for abi in arm64-v8a x86_64; do
            grep "lib/$abi/libdriving.so" /tmp/apk-files.txt || { echo "::error::C++ library missing for $abi"; exit 1; }
          done
      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch APK on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          emulator-options: -no-window -gpu swangle_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash native-game/tests/android-smoke.sh
      - uses: actions/upload-artifact@v4
        with:
          name: CoastalCity-Android-debug
          path: native-game/build/CoastalCity-debug.apk
          if-no-files-found: error
          retention-days: 14
